<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aual Baru Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        .tab-active { border-bottom: 2px solid #792C82; color: #792C82; font-weight: bold; }
        .hidden { display: none; }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl relative overflow-hidden">
        <!-- Header & Summary -->
        <div class="p-4 bg-[#792C82] text-white">
            <div class="flex items-center justify-center gap-3">
                <img src="./img/Asset 2.png" alt="Aual Baru Logo" class="w-12 h-12 object-contain rounded-md shadow-sm bg-white p-1">
                <h1 class="text-2xl font-bold">Aual Baru Stock</h1>
            </div>
            
            <div class="grid grid-cols-2 gap-2 mt-4 text-sm">
                <div class="bg-[#5D2264] p-2 rounded-lg text-center shadow-inner">
                    <p class="text-xs text-gray-200">Total Barang</p>
                    <p class="font-bold text-lg" id="sum-total">0</p>
                </div>
                <div class="bg-[#5D2264] p-2 rounded-lg text-center shadow-inner">
                    <p class="text-xs text-gray-200">Terjual</p>
                    <p class="font-bold text-lg" id="sum-sold">0</p>
                </div>
                <div class="bg-[#5D2264] p-2 rounded-lg text-center shadow-inner">
                    <p class="text-xs text-gray-200">Stok Sendiri (OR)</p>
                    <p class="font-bold text-lg" id="sum-or">0</p>
                </div>
                <div class="bg-[#5D2264] p-2 rounded-lg text-center shadow-inner">
                    <p class="text-xs text-gray-200">Titipan (TP)</p>
                    <p class="font-bold text-lg" id="sum-tp">0</p>
                </div>
            </div>
            
            <!-- Tombol Aksi Database -->
            <div class="grid grid-cols-2 gap-2 mt-4">
                <button onclick="exportToExcel()" class="bg-[#B5FF4A] hover:bg-[#a0eb3f] text-gray-900 p-2 rounded-lg font-bold text-xs col-span-2 shadow-md transition-colors flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download Database (Excel)
                </button>
                <button onclick="backupJSON()" class="bg-gray-800 hover:bg-gray-900 text-white p-2 rounded-lg font-bold text-xs shadow-md transition-colors">
                    💾 Backup JSON
                </button>
                <button onclick="document.getElementById('file-import').click()" class="bg-white hover:bg-gray-100 text-[#792C82] border border-white p-2 rounded-lg font-bold text-xs shadow-md transition-colors">
                    📂 Import JSON
                </button>
                <input type="file" id="file-import" accept=".json" class="hidden" onchange="importJSON(event)">
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex border-b text-center text-sm font-semibold bg-white sticky top-0 z-10 shadow-sm">
            <div id="tab-masuk" class="w-1/2 p-3 cursor-pointer tab-active transition-colors" onclick="switchTab('masuk')">Barang Masuk</div>
            <div id="tab-keluar" class="w-1/2 p-3 cursor-pointer text-gray-400 hover:text-gray-600 transition-colors" onclick="switchTab('keluar')">Barang Keluar</div>
        </div>

        <!-- Content: Barang Masuk -->
        <div id="content-masuk" class="p-4 bg-gray-50 pb-20">
            <button onclick="document.getElementById('modal-tambah').classList.remove('hidden')" class="w-full bg-[#792C82] hover:bg-[#5D2264] text-white font-bold py-3 rounded-xl shadow-md mb-5 transition-transform transform active:scale-95 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Tambah Barang Baru
            </button>
            
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-gray-700">Database Barang</h2>
                <select id="filter-masuk" onchange="renderList()" class="border-gray-300 border text-sm p-1.5 rounded-lg focus:ring-[#792C82] focus:border-[#792C82] bg-white outline-none">
                    <option value="all">Semua</option>
                    <option value="ready">Ready Stok</option>
                    <option value="sold">Terjual</option>
                </select>
            </div>
            <div id="list-masuk" class="space-y-3"></div>
        </div>

        <!-- Content: Barang Keluar -->
        <div id="content-keluar" class="p-4 bg-gray-50 pb-20 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm mb-5 border border-gray-100">
                <h3 class="font-bold text-sm mb-3 text-gray-700 text-center">Scan OCR Kode Barang</h3>
                <div class="relative rounded-lg overflow-hidden bg-gray-900 mb-3">
                    <video id="video-preview" class="w-full h-48 object-cover hidden" autoplay playsinline></video>
                    <div id="scanner-overlay" class="absolute inset-0 border-2 border-[#B5FF4A] border-dashed opacity-50 m-4 hidden rounded-lg pointer-events-none"></div>
                </div>
                
                <button id="btn-start-scan" onclick="startCamera()" class="bg-[#792C82] hover:bg-[#5D2264] text-white px-4 py-2.5 rounded-lg text-sm font-bold w-full mb-2 transition-colors flex justify-center items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Buka Kamera Scanner
                </button>
                <button id="btn-capture" onclick="scanOCR()" class="bg-[#B5FF4A] hover:bg-[#a0eb3f] text-gray-900 px-4 py-2.5 rounded-lg text-sm font-bold w-full hidden transition-colors shadow-md">🔍 Proses Gambar</button>
                <p id="ocr-status" class="text-xs text-center text-gray-500 mt-2 min-h-[16px]"></p>
                
                <div class="mt-4 pt-4 border-t border-gray-100">
                    <p class="text-xs text-gray-500 mb-2 font-medium">Atau input manual (Backup):</p>
                    <div class="flex gap-2">
                        <input type="text" id="manual-code" placeholder="Misal: OR-BJU-001" class="border border-gray-300 p-2 w-full rounded-lg text-sm uppercase focus:ring-[#792C82] focus:border-[#792C82] outline-none transition-all">
                        <button onclick="processCode(document.getElementById('manual-code').value.toUpperCase())" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg font-bold text-sm transition-colors">Cari</button>
                    </div>
                </div>
            </div>

            <h2 class="font-bold mb-3 text-gray-700">Riwayat Barang Keluar</h2>
            <div id="list-keluar" class="space-y-3"></div>
        </div>
    </div>

    <!-- Modal Tambah Barang -->
    <div id="modal-tambah" class="fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center p-4 hidden z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center mb-5">
                <h2 class="font-bold text-xl text-gray-800">Tambah Barang</h2>
                <button onclick="closeModalTambah()" class="text-gray-400 hover:text-gray-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="space-y-4 text-sm">
                <div class="bg-gray-50 p-3 rounded-xl border border-dashed border-gray-300">
                    <label class="block mb-2 font-semibold text-gray-700">Foto Barang</label>
                    <input type="file" id="input-foto" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-[#f1e6f3] file:text-[#792C82] hover:file:bg-[#e4d0e7] transition-all cursor-pointer" onchange="compressImage(event)">
                    <img id="preview-foto" class="mt-3 w-full h-40 object-cover rounded-lg hidden shadow-sm border border-gray-200">
                    <input type="hidden" id="foto-base64">
                </div>
                <div>
                    <label class="block mb-1.5 font-semibold text-gray-700">Kategori</label>
                    <select id="input-kategori" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-[#792C82] focus:border-[#792C82] outline-none">
                        <option value="OR">Stok Sendiri (OR)</option>
                        <option value="TP">Titipan Konsinyasi (TP)</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1.5 font-semibold text-gray-700">Jenis Barang</label>
                    <select id="input-jenis" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-[#792C82] focus:border-[#792C82] outline-none">
                        <option value="BJU">Baju</option>
                        <option value="CLN">Celana</option>
                        <option value="JKT">Jaket</option>
                        <option value="TAS">Tas</option>
                        <option value="JLB">Jilbab</option>
                        <option value="AKS">Aksesoris</option>
                        <option value="MNN">Mainan</option>
                        <option value="HSW">Houseware</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1.5 font-semibold text-gray-700">Harga (Rp)</label>
                    <input type="number" id="input-harga" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-[#792C82] focus:border-[#792C82] outline-none" placeholder="Contoh: 50000">
                </div>
            </div>
            <button onclick="simpanBarang()" class="w-full bg-[#792C82] hover:bg-[#5D2264] text-white p-3 rounded-xl font-bold mt-6 shadow-md transition-colors">Simpan Barang</button>
        </div>
    </div>

    <!-- Modal Konfirmasi Terjual -->
    <div id="modal-terjual" class="fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center p-4 hidden z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl">
            <div class="w-12 h-12 bg-[#B5FF4A] rounded-full flex items-center justify-center mx-auto mb-3 text-[#5D2264]">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="font-bold text-lg mb-3 text-gray-800">Konfirmasi Penjualan</h2>
            <div class="bg-gray-50 rounded-xl p-3 mb-4">
                <img id="konfirm-foto" class="w-32 h-32 object-cover mx-auto rounded-lg mb-3 shadow-sm border">
                <h3 id="konfirm-kode" class="font-black text-2xl text-[#792C82] tracking-wide"></h3>
                <p id="konfirm-detail" class="text-gray-600 text-sm mt-1"></p>
            </div>
            <div class="flex gap-3">
                <button onclick="document.getElementById('modal-terjual').classList.add('hidden')" class="w-1/2 border-2 border-gray-200 text-gray-600 hover:bg-gray-50 p-2.5 rounded-xl font-bold transition-colors">Batal</button>
                <button id="btn-konfirm-jual" class="w-1/2 bg-[#B5FF4A] hover:bg-[#a0eb3f] text-gray-900 p-2.5 rounded-xl font-bold shadow-md transition-colors">Konfirmasi Terjual</button>
            </div>
        </div>
    </div>

    <script>
        // Inisialisasi Database Lokal
        let db = JSON.parse(localStorage.getItem('aual_db')) || [];
        let videoStream = null;

        // --- Core Functions ---
        function updateSummary() {
            let total = db.length;
            let sold = db.filter(i => i.status === 'Terjual').length;
            let or = db.filter(i => i.kategori === 'OR').length;
            let tp = db.filter(i => i.kategori === 'TP').length;

            document.getElementById('sum-total').innerText = total;
            document.getElementById('sum-sold').innerText = sold;
            document.getElementById('sum-or').innerText = or;
            document.getElementById('sum-tp').innerText = tp;
        }

        function switchTab(tab) {
            const activeClass = 'w-1/2 p-3 cursor-pointer tab-active transition-colors';
            const inactiveClass = 'w-1/2 p-3 cursor-pointer text-gray-400 hover:text-gray-600 border-b border-transparent transition-colors';
            
            document.getElementById('tab-masuk').className = tab === 'masuk' ? activeClass : inactiveClass;
            document.getElementById('tab-keluar').className = tab === 'keluar' ? activeClass : inactiveClass;
            
            document.getElementById('content-masuk').classList.toggle('hidden', tab !== 'masuk');
            document.getElementById('content-keluar').classList.toggle('hidden', tab !== 'keluar');
            
            if(tab === 'keluar') renderKeluar();
            else renderList();
            
            // Matikan kamera jika pindah tab
            if(tab === 'masuk' && videoStream) stopCamera();
        }

        // --- Fitur Barang Masuk ---
        function closeModalTambah() {
            document.getElementById('modal-tambah').classList.add('hidden');
            document.getElementById('input-foto').value = '';
            document.getElementById('preview-foto').classList.add('hidden');
            document.getElementById('foto-base64').value = '';
            document.getElementById('input-harga').value = '';
        }

        function compressImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600; // Kompres ukuran agar localstorage & excel tidak berat
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const base64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('foto-base64').value = base64;
                    document.getElementById('preview-foto').src = base64;
                    document.getElementById('preview-foto').classList.remove('hidden');
                }
            };
        }

        function generateKode(kat, jenis) {
            const prefix = `${kat}-${jenis}-`;
            const similarItems = db.filter(i => i.kode.startsWith(prefix));
            const count = similarItems.length + 1;
            return prefix + count.toString().padStart(3, '0');
        }

        function simpanBarang() {
            const foto = document.getElementById('foto-base64').value;
            const kat = document.getElementById('input-kategori').value;
            const jenis = document.getElementById('input-jenis').value;
            const harga = document.getElementById('input-harga').value;

            if(!foto || !harga) return alert("Foto dan Harga wajib diisi!");

            const kode = generateKode(kat, jenis);
            
            const newItem = {
                id: Date.now(),
                kode: kode,
                kategori: kat,
                jenis: jenis,
                harga: parseInt(harga),
                foto: foto,
                status: 'Ready',
                tanggal: new Date().toLocaleDateString('id-ID')
            };

            db.push(newItem);
            localStorage.setItem('aual_db', JSON.stringify(db));
            
            closeModalTambah();
            updateSummary();
            renderList();
            
            // Notifikasi sukses sederhana
            alert(`Barang tersimpan dengan kode:\n${kode}`);
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        function renderList() {
            const filter = document.getElementById('filter-masuk').value;
            const container = document.getElementById('list-masuk');
            container.innerHTML = '';
            
            let filteredDb = db.slice().reverse(); // Tampilkan yang terbaru di atas
            if(filter === 'ready') filteredDb = filteredDb.filter(i => i.status === 'Ready');
            if(filter === 'sold') filteredDb = filteredDb.filter(i => i.status === 'Terjual');

            if(filteredDb.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 p-4 bg-white rounded-xl border border-dashed">Tidak ada barang ditemukan.</div>';
                return;
            }

            filteredDb.forEach(item => {
                const isSold = item.status === 'Terjual';
                container.innerHTML += `
                    <div class="flex border border-gray-100 p-3 rounded-xl bg-white shadow-sm items-center transition-all ${isSold ? 'opacity-60 grayscale-[30%]' : 'hover:shadow-md'}">
                        <img src="${item.foto}" class="w-16 h-16 object-cover rounded-lg mr-3 border border-gray-200">
                        <div class="flex-1">
                            <p class="font-black text-[#792C82] tracking-wide text-sm">${item.kode}</p>
                            <p class="text-xs text-gray-500 font-medium mb-0.5">${item.kategori} - ${item.jenis}</p>
                            <p class="text-sm font-bold text-gray-800">${formatRupiah(item.harga)}</p>
                        </div>
                        <div class="text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wider ${isSold ? 'bg-gray-100 text-gray-500' : 'bg-[#B5FF4A] text-gray-900'}">
                            ${item.status}
                        </div>
                    </div>
                `;
            });
        }

        // --- Fitur Barang Keluar (OCR & Jual) ---
        async function startCamera() {
            const video = document.getElementById('video-preview');
            const overlay = document.getElementById('scanner-overlay');
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = videoStream;
                video.classList.remove('hidden');
                overlay.classList.remove('hidden');
                document.getElementById('btn-start-scan').classList.add('hidden');
                document.getElementById('btn-capture').classList.remove('hidden');
                document.getElementById('ocr-status').innerText = "Arahkan kamera ke label kode (Posisikan di tengah), lalu klik Proses.";
            } catch (err) {
                alert("Tidak dapat mengakses kamera. Pastikan izin kamera diberikan dan Anda mengakses web ini menggunakan HTTPS.");
            }
        }

        function stopCamera() {
            if(videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            document.getElementById('video-preview').classList.add('hidden');
            document.getElementById('scanner-overlay').classList.add('hidden');
            document.getElementById('btn-start-scan').classList.remove('hidden');
            document.getElementById('btn-capture').classList.add('hidden');
            document.getElementById('ocr-status').innerText = "";
        }

        async function scanOCR() {
            const video = document.getElementById('video-preview');
            const statusText = document.getElementById('ocr-status');
            const btnCapture = document.getElementById('btn-capture');
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            statusText.innerHTML = `<span class="animate-pulse text-[#792C82] font-semibold">Memproses gambar... Mohon tunggu.</span>`;
            btnCapture.disabled = true;
            btnCapture.classList.add('opacity-50');
            
            try {
                const result = await Tesseract.recognize(canvas.toDataURL('image/jpeg'), 'eng');
                const text = result.data.text;
                
                // Regex: Mencari pola kode seperti OR-BJU-001, TP-CLN-010 (Case insensitive)
                const match = text.match(/(OR|TP)-[A-Z]{3}-\d{3}/i);
                
                if(match) {
                    statusText.innerText = `Terdeteksi: ${match[0].toUpperCase()}`;
                    stopCamera();
                    processCode(match[0].toUpperCase());
                } else {
                    statusText.innerHTML = `<span class="text-red-500">Kode tidak terdeteksi jelas. Coba scan ulang atau input manual.</span>`;
                }
            } catch (error) {
                statusText.innerText = "Error sistem OCR.";
            } finally {
                btnCapture.disabled = false;
                btnCapture.classList.remove('opacity-50');
            }
        }

        function processCode(kodeInput) {
            if(!kodeInput) return;
            const itemIndex = db.findIndex(i => i.kode === kodeInput);
            
            if(itemIndex === -1) {
                alert("Barang dengan kode tersebut tidak ditemukan di database!");
                return;
            }
            
            const item = db[itemIndex];
            if(item.status === 'Terjual') {
                alert(`Perhatian: Barang ${item.kode} sudah berstatus TERJUAL!`);
                return;
            }

            // Tampilkan Modal Konfirmasi
            document.getElementById('konfirm-foto').src = item.foto;
            document.getElementById('konfirm-kode').innerText = item.kode;
            document.getElementById('konfirm-detail').innerHTML = `
                <span class="font-semibold text-gray-700">${item.kategori} - ${item.jenis}</span><br>
                <span class="text-[#792C82] font-bold text-lg">${formatRupiah(item.harga)}</span>
            `;
            
            document.getElementById('btn-konfirm-jual').onclick = function() {
                db[itemIndex].status = 'Terjual';
                db[itemIndex].tanggal_terjual = new Date().toLocaleDateString('id-ID');
                localStorage.setItem('aual_db', JSON.stringify(db));
                document.getElementById('modal-terjual').classList.add('hidden');
                document.getElementById('manual-code').value = '';
                updateSummary();
                renderKeluar();
                
                // Tampilkan notifikasi singkat
                const notif = document.createElement('div');
                notif.className = "fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-[#B5FF4A] text-gray-900 px-4 py-2 rounded-lg font-bold shadow-lg z-50 text-sm";
                notif.innerText = "✅ Barang Berhasil Terjual!";
                document.body.appendChild(notif);
                setTimeout(() => notif.remove(), 2500);
            };
            
            document.getElementById('modal-terjual').classList.remove('hidden');
        }

        function renderKeluar() {
            const container = document.getElementById('list-keluar');
            container.innerHTML = '';
            const soldItems = db.filter(i => i.status === 'Terjual').reverse();
            
            if(soldItems.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 p-4 bg-white rounded-xl border border-dashed">Belum ada barang yang terjual.</div>';
                return;
            }

            soldItems.forEach(item => {
                container.innerHTML += `
                    <div class="flex border border-gray-100 p-3 rounded-xl bg-white shadow-sm items-center hover:shadow-md transition-shadow">
                        <img src="${item.foto}" class="w-12 h-12 object-cover rounded-lg mr-3 border border-gray-200">
                        <div class="flex-1">
                            <p class="font-black text-gray-800 text-sm">${item.kode}</p>
                            <p class="text-[11px] text-gray-500 font-medium">Terjual: <span class="text-[#792C82]">${item.tanggal_terjual}</span></p>
                        </div>
                        <div class="text-sm font-bold text-gray-800 bg-gray-50 px-2 py-1 rounded-md border">${formatRupiah(item.harga)}</div>
                    </div>
                `;
            });
        }

        // --- Fitur Export Excel dengan ExcelJS (Gambar Asli) ---
        async function exportToExcel() {
            if(db.length === 0) return alert("Database masih kosong!");
            
            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('Database Barang');

            worksheet.columns = [
                { header: 'No', key: 'no', width: 5 },
                { header: 'Foto Barang', key: 'foto', width: 20 },
                { header: 'Kode Barang', key: 'kode', width: 15 },
                { header: 'Kategori', key: 'kategori', width: 10 },
                { header: 'Jenis', key: 'jenis', width: 15 },
                { header: 'Harga', key: 'harga', width: 15 },
                { header: 'Status', key: 'status', width: 15 },
                { header: 'Tgl Input', key: 'tanggal', width: 15 },
                { header: 'Tgl Terjual', key: 'tanggal_terjual', width: 15 }
            ];

            // Styling header
            worksheet.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
            worksheet.getRow(1).alignment = { vertical: 'middle', horizontal: 'center' };
            worksheet.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF792C82' } };

            for(let i = 0; i < db.length; i++) {
                let item = db[i];
                let row = worksheet.addRow({
                    no: i + 1,
                    kode: item.kode,
                    kategori: item.kategori,
                    jenis: item.jenis,
                    harga: item.harga,
                    status: item.status,
                    tanggal: item.tanggal,
                    tanggal_terjual: item.tanggal_terjual || '-'
                });

                // Set tinggi baris agar foto muat
                row.height = 80;

                // Proses ekstrak base64 gambar
                if(item.foto) {
                    try {
                        const base64Data = item.foto.split(',')[1];
                        const extension = item.foto.substring("data:image/".length, item.foto.indexOf(";base64"));
                        
                        const imageId = workbook.addImage({
                            base64: base64Data,
                            extension: extension
                        });

                        // Tambahkan gambar ke sel kolom B (index 1), baris i+1 (karena ada header)
                        worksheet.addImage(imageId, {
                            tl: { col: 1, row: i + 1 },
                            ext: { width: 100, height: 100 },
                            editAs: 'oneCell'
                        });
                    } catch (e) {
                        console.error("Gagal memuat gambar untuk diexport", e);
                    }
                }
                
                // Alignment sel
                row.alignment = { vertical: 'middle', horizontal: 'center' };
            }

            // Generate File
            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            saveAs(blob, "Database_Aual_Baru_Stock.xlsx");
        }

        // --- FITUR BACKUP & IMPORT JSON ---
        function backupJSON() {
            if(db.length === 0) return alert("Belum ada data untuk di-backup!");
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            
            // Format nama file dengan tanggal
            const dateStr = new Date().toISOString().split('T')[0];
            downloadAnchorNode.setAttribute("download", `Backup_Aual_Stock_${dateStr}.json`);
            
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedDb = JSON.parse(e.target.result);
                    if(confirm("PERHATIAN: Data di perangkat ini akan DITIMPA oleh data dari file yang Anda upload. Lanjutkan?")) {
                        db = importedDb;
                        localStorage.setItem('aual_db', JSON.stringify(db));
                        updateSummary();
                        renderList();
                        renderKeluar();
                        alert("Berhasil! Data telah tersinkronisasi.");
                    }
                } catch (error) {
                    alert("File tidak valid. Pastikan Anda memilih file berextensi .json");
                }
                event.target.value = ""; // reset nilai file input
            };
            reader.readAsText(file);
        }

        // Init App pada saat pertama kali dimuat
        updateSummary();
        renderList();
    </script>
</body>
</html>
